name: Projects CI

on:
  push:
    branches: [master, main, 'reboot/**']
  pull_request:
    branches: [master, main]

jobs:
  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify project structure
        run: node scripts/verify-projects.mjs

  build-hello-dock:
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build hello-dock starter
        working-directory: hello-dock/starter
        run: npm ci && npm run build

      - name: Build hello-dock completed Docker image
        working-directory: hello-dock/completed
        run: docker build -t hello-dock-completed .

  build-imgtool:
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imgtool completed Docker image
        working-directory: imgtool/completed
        run: docker build -t imgtool-completed .

      - name: Smoke test imgtool
        working-directory: imgtool/completed
        run: docker run --rm -v "$PWD/fixtures":/workspace imgtool-completed report /workspace

  build-go-service:
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test Go service
        working-directory: notes-api-go/starter
        run: go test ./...

      - name: Build Go Docker image
        working-directory: notes-api-go/completed
        run: docker build -t notes-api-go-completed .

  build-python-service:
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Python Docker image
        working-directory: notes-api-python/completed
        run: docker build -t notes-api-python-completed .

  build-llm-demo:
    runs-on: ubuntu-latest
    needs: verify-structure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LLM demo Docker image
        working-directory: llm-runtime-demo/completed
        run: docker build -t llm-runtime-demo .

      - name: Smoke test LLM demo
        run: docker run --rm -e LLM_MODE=smoke llm-runtime-demo
